app = "visit-jamaica-ai-planner-api"
primary_region = "lhr"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  ENVIRONMENT = "production"
  DEMO_MODE = "false"
  PORT = "8080"
  MONGODB_DATABASE = "visit_jamaica"
  ELASTICSEARCH_INDEX = "visit-jamaica-content"
  ELASTICSEARCH_TRAVEL_INDEX = "visit-jamaica-travel"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health/live"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
